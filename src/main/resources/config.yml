storage:
  display:
    # Wie oft Display-Entfernungen und aktive Anzeigeinhalte aktualisiert werden.
    refresh-ticks: 20
    # Maximal so viele getrackte Shulker werden pro Refresh aktualisiert, damit keine kurzen Spikes entstehen.
    refresh-budget-per-run: 6
    # In Refresh-Zyklen. ChunkLoad/Place/Break tracken die meisten Aenderungen bereits.
    nearby-chunk-scan-interval: 6
    full-chunk-scan-interval: 300
    detail-view-distance: 16.0
    max-view-distance: 64.0
  mysql:
    # Wenn deaktiviert, nutzt Storage automatisch die lokale Nitrite-Datenbank.
    enabled: false
    host: "127.0.0.1"
    port: 3306
    database: "storage"
    username: "root"
    password: "change_me"
    use_ssl: false
    # Deprecated: wird von modernen MySQL Connector/J Versionen nicht verlaesslich genutzt.
    auto_reconnect: true
    connect_timeout_ms: 5000
    socket_timeout_ms: 15000
    tcp_keep_alive: true

